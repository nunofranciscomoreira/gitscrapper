# Pinned gitleaks config for gitscrapper. It is passed with --config so a
# scanned repo's own .gitleaks.toml cannot replace or weaken these rules.
title = "gitscrapper"

[extend]
# Start from gitleaks' default rules, then add the custom rules below for
# formats the default rules miss (see tests/test_gitscrapper.py for the
# fixture baseline these were written against).
useDefault = true

[[rules]]
id = "agora-api-key"
description = "Agora App ID/Certificate/Secret"
regex = '''(?i)agora_app_(?:id|certificate|secret)\s*=\s*[0-9a-f]{32}'''
keywords = ["agora"]

[[rules]]
id = "alchemy-api-key"
description = "Alchemy API key in an alchemyapi.io URL"
regex = '''alchemyapi\.io/v2/[A-Za-z0-9_-]{20,}'''
keywords = ["alchemyapi"]

[[rules]]
id = "amazon-mws-auth-token"
description = "Amazon MWS auth token"
regex = '''amzn\.mws\.[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'''
keywords = ["amzn.mws"]

[[rules]]
id = "amqp-credentials"
description = "Credentials embedded in an amqp:// connection URI"
regex = '''amqp://[^:\s]+:[^@\s]+@[^\s'"]+'''
keywords = ["amqp://"]

[[rules]]
id = "anypoint-platform-credentials"
description = "Mulesoft Anypoint Platform client id/secret"
regex = '''(?i)anypoint\.platform\.client_(?:id|secret)>([0-9a-zA-Z]{32})<'''
secretGroup = 1
keywords = ["anypoint"]

[[rules]]
id = "asana-access-token"
description = "Asana personal access token"
regex = '''[0-9]/(?:[0-9]{10,}:)?[0-9a-f]{32}'''
keywords = ["asana"]

[[rules]]
id = "aws-credentials-generic"
description = "aws_access_key_id/aws_secret_access_key assignment, including non-standard prefixes the default aws-access-token rule misses"
regex = '''(?i)aws_(?:access_key_id|secret_access_key)\s*=\s*['"]?[A-Za-z0-9/+]{16,64}['"]?'''
keywords = ["aws_access_key_id", "aws_secret_access_key"]

[[rules]]
id = "azure-management-certificate"
description = "Azure service management certificate"
regex = '''(?i)managementcertificate\s*=\s*[A-Za-z0-9+/=]{16,}'''
keywords = ["managementcertificate"]

[[rules]]
id = "beamer-api-key"
description = "Beamer API key (b_ prefixed)"
regex = '''=\s*['"]?(b_[A-Za-z0-9+/_=-]{30,60})'''
secretGroup = 1
keywords = ["token", "beamer"]

[[rules]]
id = "bearer-token-generic"
description = "Generic Bearer token, e.g. in an Authorization header"
regex = '''(?i)bearer\s+[A-Za-z0-9_\-.=]{15,}'''
keywords = ["bearer"]
